name: airport_mobile
description: ClashNova 移动客户端
publish_to: "none"
repository: https://github.com/clashnova-dev/ClashNova-Mobile
version: 0.1.1+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sing_box:
    path: third_party/sing_box
  http: ^1.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0
  intl: any
  yaml: ^3.1.2
  lucide_icons_flutter: ^4.0.3
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.0
  basic_utils: ^5.7.0
  file_picker: ^13.4.1
  qr_flutter: ^4.1.0
  nsd: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icon/

# App launcher icon (run: dart run flutter_launcher_icons). Source art is the
# user-provided assets/icon/icon.png (transparent, 1024²).
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
